name: CI tests
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: pr-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - run: node --test scripts/release/*.test.mjs scripts/run-build-command.test.js

  desktop:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.data/pr-bun-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: pr-bun-ubuntu24-1.3.9-${{ hashFiles('aionui/bun.lock') }}
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Prepare the pinned Chrome DevTools dependency and browser MCP bundle
        run: node scripts/prepare-chrome-devtools-mcp.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: bun run test
        working-directory: aionui

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: aioncore, toolchain: '1.95.0' }
          - { component: aionrs, toolchain: '1.96.1' }
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.component }}/target
          key: pr-ubuntu24-${{ matrix.component }}-${{ matrix.toolchain }}-${{ hashFiles('aioncore/Cargo.lock', 'aionrs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: pr-ubuntu24-${{ matrix.component }}-${{ matrix.toolchain }}-${{ hashFiles('aioncore/Cargo.lock', 'aionrs/Cargo.lock') }}-
      - run: cargo +${{ matrix.toolchain }} test --locked --workspace --lib
        working-directory: ${{ matrix.component }}

  secrets-vault:
    name: Secrets vault (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aioncore/target
          key: secrets-${{ runner.os }}-1.95-${{ hashFiles('aioncore/Cargo.lock', 'aionrs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: secrets-${{ runner.os }}-1.95-${{ hashFiles('aioncore/Cargo.lock', 'aionrs/Cargo.lock') }}-
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake pkg-config libssl-dev libasound2-dev libudev-dev
      - name: Verify encrypted vault and history masking
        working-directory: aioncore
        run: cargo +1.95.0 test --locked -p aionui-secrets
      - name: Verify human transport boundaries
        working-directory: aioncore
        run: cargo +1.95.0 test --locked -p aionui-app --lib secrets::access_tests
      - name: Verify scoped Secrets HTTP integration
        working-directory: aioncore
        run: cargo +1.95.0 test --locked -p aionui-app --test secrets_e2e
      - name: Verify sensitive event projections
        working-directory: aioncore
        run: cargo +1.95.0 test --locked -p aionui-ai-agent --lib capability::sensitive
      - name: Verify ACP recovered Secrets confirmations
        working-directory: aioncore
        run: cargo +1.95.0 test --locked -p aionui-ai-agent --lib secrets_sdk_permission_roundtrip
      - name: Verify Codex Secrets approval wire
        working-directory: aioncore
        run: cargo +1.95.0 test --locked -p aionui-session --lib secrets_wire_
      - name: Select native Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Verify native MCP approvals and raw delivery
        working-directory: aionrs
        run: cargo +1.96.1 test --locked -p aion-agent sensitive_

  secrets-headless:
    name: Secrets passphrase (headless container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .data/secrets-container-cargo
            .data/secrets-container-target
          key: secrets-headless-1.95-${{ hashFiles('aioncore/Cargo.lock', 'aionrs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: secrets-headless-1.95-${{ hashFiles('aioncore/Cargo.lock', 'aionrs/Cargo.lock') }}-
      - name: Verify passphrase recovery without a desktop key store
        run: |
          mkdir -p .data/secrets-container-cargo .data/secrets-container-target
          docker run --rm \
            --volume "$PWD:/workspace" \
            --volume "$PWD/.data/secrets-container-cargo:/cache" \
            --volume "$PWD/.data/secrets-container-target:/target" \
            --workdir /workspace/aioncore \
            --env CARGO_HOME=/cache \
            --env CARGO_TARGET_DIR=/target \
            --env CARGO_BUILD_JOBS=2 \
            --env CARGO_PROFILE_TEST_DEBUG=0 \
            rust:1.95.0-bookworm \
            bash -ec 'apt-get update && apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev libasound2-dev libudev-dev && cargo test --locked -p aionui-secrets'
