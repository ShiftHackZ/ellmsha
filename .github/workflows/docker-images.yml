name: Release Linux images
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    outputs:
      image_manifest_artifact_name:
        description: Artifact containing images.json and the isolated smoke report
        value: ${{ jobs.images.outputs.artifact }}
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_REVISION: ${{ inputs.source_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
      - name: Validate release inputs and create tracked-only context
        id: identity
        shell: bash
        run: |
          node --test docker/release-images.test.mjs
          node scripts/prepare-open-computer-use.js --verify-only
          node scripts/prepare-mobile-mcp.js --verify-only
          node scripts/prepare-chrome-devtools-mcp.js --verify-only
          node docker/release-images.mjs prepare-context "$RUNNER_TEMP/ellmsha-docker-source" "$RELEASE_VERSION" "$SOURCE_REVISION"
          echo "artifact=ellmsha-images-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            memory=6g
            cpu-quota=200000
      - name: Build web with Core and RS
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ellmsha-docker-source
          file: ${{ runner.temp }}/ellmsha-docker-source/docker/aionui.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ellmsha-release-web:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/ShiftHackZ/ellmsha
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.title=eLLMsha web
          cache-from: type=gha,scope=ellmsha-web-amd64
          cache-to: type=gha,mode=max,scope=ellmsha-web-amd64
      - name: Build MemoryCore
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ellmsha-docker-source
          file: ${{ runner.temp }}/ellmsha-docker-source/docker/memory.Dockerfile
          target: memory-core
          platforms: linux/amd64
          load: true
          push: false
          tags: ellmsha-release-memory-core:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/ShiftHackZ/ellmsha
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.title=eLLMsha MemoryCore
          cache-from: type=gha,scope=ellmsha-memory-core-amd64
          cache-to: type=gha,mode=max,scope=ellmsha-memory-core-amd64
      - name: Build memory hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ellmsha-docker-source
          file: ${{ runner.temp }}/ellmsha-docker-source/docker/memory.Dockerfile
          target: memory-hub
          platforms: linux/amd64
          load: true
          push: false
          tags: ellmsha-release-memory-hub:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/ShiftHackZ/ellmsha
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.title=eLLMsha memory hub
          cache-from: type=gha,scope=ellmsha-memory-hub-amd64
          cache-to: type=gha,mode=max,scope=ellmsha-memory-hub-amd64
      - name: Build optional proxy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ellmsha-docker-source
          file: ${{ runner.temp }}/ellmsha-docker-source/docker/memory.Dockerfile
          target: memory-proxy
          platforms: linux/amd64
          load: true
          push: false
          tags: ellmsha-release-memory-proxy:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/ShiftHackZ/ellmsha
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.title=eLLMsha memory proxy
          cache-from: type=gha,scope=ellmsha-memory-proxy-amd64
          cache-to: type=gha,mode=max,scope=ellmsha-memory-proxy-amd64
      - name: Smoke isolated images before publishing any candidate
        run: python3 docker/smoke-images.py --output "$RUNNER_TEMP/docker-smoke.json"
      - name: Record image provenance
        run: node docker/release-images.mjs manifest "$RUNNER_TEMP/images.json" "$RELEASE_VERSION" "$SOURCE_REVISION"
      - name: Authenticate GHCR for approved publication
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and SHA candidates (never latest)
        if: inputs.publish
        run: node docker/release-images.mjs publish "$RUNNER_TEMP/images.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            ${{ runner.temp }}/images.json
            ${{ runner.temp }}/docker-smoke.json
            ${{ runner.temp }}/ellmsha-docker-source/docker/source.json
          if-no-files-found: error
