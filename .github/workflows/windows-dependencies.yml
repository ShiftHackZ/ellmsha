name: Verify desktop builds
on:
  workflow_dispatch:
    inputs:
      warm_macos:
        description: 'Warm the macOS build cache on main instead of verifying Windows.'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dependencies:
    if: ${{ !inputs.warm_macos }}
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      ELLM_SHA_CARGO_HOME: ${{ github.workspace }}/.data/cargo
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
          cache: false
      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Configure build caches
        run: |
          node -e "const fs=require('node:fs'),p=require('node:path');for(const [k,v] of Object.entries({BUN_INSTALL_CACHE_DIR:'bun-cache',NPM_CONFIG_CACHE:'npm-cache',ELECTRON_CACHE:'electron-cache',ELECTRON_BUILDER_CACHE:'electron-builder-cache'}))fs.appendFileSync(process.env.GITHUB_ENV,k+'='+p.join(process.env.RUNNER_TEMP,v)+'\n')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            .data/cargo/registry
            .data/cargo/git
            aioncore/target
            ${{ runner.temp }}/bun-cache
            ${{ runner.temp }}/npm-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: desktop-win-x64-rust1.95.0-node24.11.0-bun1.3.9-verify-${{ github.sha }}
          restore-keys: desktop-win-x64-rust1.95.0-node24.11.0-bun1.3.9-
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Build unsigned Windows installer
        run: node scripts/release/build.mjs --unsigned
      - name: Verify installer
        run: node scripts/release/verify-artifacts.mjs
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            .data/cargo/registry
            .data/cargo/git
            aioncore/target
            ${{ runner.temp }}/bun-cache
            ${{ runner.temp }}/npm-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  mac-cache:
    if: inputs.warm_macos && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_STRIP: 'none'
      CARGO_HOME: ${{ github.workspace }}/.data/cargo
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: Select release toolchains
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          rustup toolchain install 1.95.0 --profile minimal
      - name: Configure build caches
        run: |
          node -e "const fs=require('node:fs'),p=require('node:path');for(const [k,v] of Object.entries({BUN_INSTALL_CACHE_DIR:'bun-cache',NPM_CONFIG_CACHE:'npm-cache',ELECTRON_CACHE:'electron-cache',ELECTRON_BUILDER_CACHE:'electron-builder-cache'}))fs.appendFileSync(process.env.GITHUB_ENV,k+'='+p.join(process.env.RUNNER_TEMP,v)+'\n')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            .data/cargo/registry
            .data/cargo/git
            aioncore/target
            ${{ runner.temp }}/bun-cache
            ${{ runner.temp }}/npm-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: desktop-mac-arm64-rust1.95.0-node24.11.0-bun1.3.9-warm-${{ github.sha }}
          restore-keys: desktop-mac-arm64-rust1.95.0-node24.11.0-bun1.3.9-
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Build release Core for shared cache
        working-directory: aioncore
        run: cargo build --locked --release -p aionui-app --bin aioncore
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            .data/cargo/registry
            .data/cargo/git
            aioncore/target
            ${{ runner.temp }}/bun-cache
            ${{ runner.temp }}/npm-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
